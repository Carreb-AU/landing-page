<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carreb — Arriving 1 June 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --dark:       #0d1f14;
      --dark-mid:   #162e20;
      --lime:       #52b788;
      --lime-bright:#74c69d;
      --lime-glow:  #78e14a;
      --white:      #ffffff;
      --white-60:   rgba(255,255,255,0.60);
      --white-25:   rgba(255,255,255,0.25);
      --white-08:   rgba(255,255,255,0.08);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--dark);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Radial glow background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 45%, rgba(82,183,136,0.13) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(116,198,157,0.07) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle grain texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 0;
      animation: fadeUp 1.2s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ── Logo ── */
    .logo-wrap {
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.2s both;
    }

    .logo-wrap img,
    .logo-wrap svg {
      width: auto;
      height: clamp(64px, 11vw, 110px);
      border-radius: 12px;
      filter: drop-shadow(0 0 32px rgba(116,198,157,0.25));
    }

    /* ── Divider line ── */
    .rule {
      width: clamp(40px, 8vw, 72px);
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--lime), transparent);
      margin: 40px auto;
      opacity: 0;
      animation: fadeIn 1s ease 0.8s both;
    }

    /* ── Headline ── */
    .headline {
      font-family: 'Lora', serif;
      font-size: clamp(36px, 7vw, 80px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--white);
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.5s both;
    }

    .headline .accent {
      color: var(--lime-bright);
      font-style: italic;
    }

    /* ── Date badge ── */
    .date-badge {
      margin-top: 32px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--white-08);
      border: 1px solid rgba(82,183,136,0.28);
      border-radius: 100px;
      padding: 10px 24px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.75s both;
    }

    .date-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime-glow);
      box-shadow: 0 0 8px var(--lime-glow);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .date-badge span {
      font-size: clamp(13px, 2vw, 16px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--lime-bright);
    }

    /* ── Tagline ── */
    .tagline {
      margin-top: 28px;
      font-size: clamp(14px, 2vw, 17px);
      font-weight: 500;
      color: var(--white-60);
      letter-spacing: 0.01em;
      line-height: 1.6;
      max-width: 420px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 1s both;
    }

    /* ── URL ── */
    .url {
      margin-top: 40px;
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--white-25);
      text-decoration: none;
      text-transform: lowercase;
      transition: color 0.3s;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 1.2s both;
    }

    .url:hover { color: var(--lime-bright); }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.75); }
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .logo-wrap { margin-bottom: 36px; }
      .rule { margin: 32px auto; }
      .date-badge { padding: 9px 20px; }
      .tagline { max-width: 320px; }
    }
  </style>
</head>
<body>
  <div class="stage">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="carreb-logo.svg" alt="Carreb" />
    </div>

    <!-- Headline -->
    <h1 class="headline">Less confusion.<br><span class="accent">More living.</span></h1>

    <!-- Rule -->
    <div class="rule"></div>

    <!-- Arriving badge -->
    <div class="date-badge">
      <div class="dot"></div>
      <span>Arriving 1 June 2026</span>
    </div>

    <!-- URL -->
    <a class="url" href="https://www.carreb.com.au">www.carreb.com.au</a>

  </div>
</body>
</html>
